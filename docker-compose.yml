services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB?Set POSTGRES_DB in .env}
      DATA_DIR: /data
      PYTHONPATH: /app
      CITY_TIMEZONE: Australia/Melbourne
      CROWD_LOW_MAX: ${CROWD_LOW_MAX:-10}
      CROWD_MEDIUM_MAX: ${CROWD_MEDIUM_MAX:-30}
      ETL_PAGE_SIZE: ${ETL_PAGE_SIZE:-100}
      ETL_MAX_RECORDS: ${ETL_MAX_RECORDS:-1000}
      MINUTE_LOOKBACK_MINUTES: ${MINUTE_LOOKBACK_MINUTES:-60}
      MINUTE_RETENTION_MINUTES: ${MINUTE_RETENTION_MINUTES:-90}
      REFERENCE_REFRESH_INTERVAL_HOURS: ${REFERENCE_REFRESH_INTERVAL_HOURS:-24}
      ARCHIVE_RAW_RECORDS: ${ARCHIVE_RAW_RECORDS:-true}
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    command: ["python", "-m", "scripts.ingest_open_data"]

  etl-scheduler:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB?Set POSTGRES_DB in .env}
      DATA_DIR: /data
      PYTHONPATH: /app
      CITY_TIMEZONE: Australia/Melbourne
      CROWD_LOW_MAX: ${CROWD_LOW_MAX:-10}
      CROWD_MEDIUM_MAX: ${CROWD_MEDIUM_MAX:-30}
      ETL_PAGE_SIZE: ${ETL_PAGE_SIZE:-100}
      ETL_MAX_RECORDS: ${ETL_MAX_RECORDS:-1000}
      MINUTE_LOOKBACK_MINUTES: ${MINUTE_LOOKBACK_MINUTES:-60}
      MINUTE_RETENTION_MINUTES: ${MINUTE_RETENTION_MINUTES:-90}
      REFERENCE_REFRESH_INTERVAL_HOURS: ${REFERENCE_REFRESH_INTERVAL_HOURS:-24}
      ETL_REFRESH_INTERVAL_MINUTES: ${ETL_REFRESH_INTERVAL_MINUTES:-15}
      ETL_SCOPE: ${ETL_SCOPE:-minute}
      ARCHIVE_RAW_RECORDS: ${ARCHIVE_RAW_RECORDS:-true}
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-u", "-m", "scripts.run_scheduled_ingest"]

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB?Set POSTGRES_DB in .env}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./backend:/app
      - ./database/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    command: ["python", "-m", "scripts.migrate"]

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB?Set POSTGRES_DB in .env}
      PYTHONPATH: /app
      DATA_STALE_AFTER_MINUTES: ${DATA_STALE_AFTER_MINUTES:-60}
      CROWD_LOW_MAX: ${CROWD_LOW_MAX:-10}
      CROWD_MEDIUM_MAX: ${CROWD_MEDIUM_MAX:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ROUTE_SENSOR_RADIUS_METRES: ${ROUTE_SENSOR_RADIUS_METRES:-80}
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_TIMEOUT_SECONDS: ${ORS_TIMEOUT_SECONDS:-10}
      GEOCODER_SEARCH_URL: ${GEOCODER_SEARCH_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODER_TIMEOUT_SECONDS: ${GEOCODER_TIMEOUT_SECONDS:-8}
      GEOCODER_MIN_INTERVAL_SECONDS: ${GEOCODER_MIN_INTERVAL_SECONDS:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
