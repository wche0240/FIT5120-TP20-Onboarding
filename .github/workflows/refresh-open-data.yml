name: Refresh Open Data

on:
  schedule:
    # Offset from the start of each hour to reduce GitHub Actions scheduler delay.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# This workflow only calls the protected production API; it does not need
# repository contents or a direct database connection.
permissions: {}

# Do not start a second ingestion while the previous refresh is still running.
concurrency:
  group: production-open-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Render production ETL
        env:
          API_BASE_URL: https://fit5120-tp20-onboarding.onrender.com
          ETL_TRIGGER_TOKEN: ${{ secrets.ETL_TRIGGER_TOKEN }}
        run: |
          if [ -z "$ETL_TRIGGER_TOKEN" ]; then
            echo "::error::GitHub Actions secret ETL_TRIGGER_TOKEN is missing."
            exit 1
          fi

          # Call the deployed API so the job updates the exact PostgreSQL
          # database that the public website reads from.
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 1 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 120 \
            -X POST "${API_BASE_URL}/api/v1/internal/ingest" \
            -H "X-ETL-Token: ${ETL_TRIGGER_TOKEN}"

          echo
          echo "Latest data timestamp observed by the public API:"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            "${API_BASE_URL}/api/v1/data-status"
          echo
