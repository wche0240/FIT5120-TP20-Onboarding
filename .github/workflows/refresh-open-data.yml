name: Refresh Open Data

on:
  schedule:
    # Offset from the start of each hour to reduce GitHub Actions scheduler delay.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# The runner needs a short-lived token to check out this private repository.
permissions:
  contents: read

# Do not start a second ingestion while the previous refresh is still running.
concurrency:
  group: production-open-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the production ETL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETL dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Refresh production open data
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          MIGRATIONS_DIR: database/migrations
          PYTHONPATH: backend
          # GitHub-hosted runners cannot write to the container-only /data mount.
          DATA_DIR: /tmp/sensoryway-open-data
        run: |
          python -m scripts.migrate
          python -m scripts.ingest_open_data
